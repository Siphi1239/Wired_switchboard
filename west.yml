# West manifest for the Wired Switchboard workspace ("workspace application").
#
#   west init -m https://github.com/siphi1239/wired_switchboard --mr main ~/ws-switchboard
#   cd ~/ws-switchboard && west update
#
# Pins the nRF Connect SDK to v3.3.0 (Zephyr 4.3.99, Matter fork v3.3.0).
manifest:
  version: "1.2"
  self:
    path: wired_switchboard

  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect

  projects:
    - name: nrf
      remote: ncs
      repo-path: sdk-nrf
      revision: v3.3.0
      import:
        # Keep the workspace lean: no Wi-Fi supplicant, cellular modem lib,
        # Find My, cloud SDKs or sensor blobs. Matter stays in for phase 2.
        name-blocklist:
          - hostap
          - wfa-qt-control-app
          - libmodem
          - find-my
          - azure-sdk-for-c
          - memfault-firmware-sdk
          - cirrus
          - bsec
          - bme68x
          - coremark
