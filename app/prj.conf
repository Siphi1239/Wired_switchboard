# SPDX-License-Identifier: Apache-2.0
# Wired Switchboard - phase 1: 10BASE-T1S (LAN8651 MAC-PHY) + MQTT

# ---------------------------------------------------------------- System
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ASSERT=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_RESET_ON_FATAL_ERROR=y

# ---------------------------------------------------------------- Logging / shell
# Dev console = UART0 via the J-Link VCOM on the DK.
# For USB CDC-ACM instead:  west build ... -S cdc-acm-console
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_NET_SHELL=y

# ---------------------------------------------------------------- Persistent settings
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_RUNTIME=y

# ---------------------------------------------------------------- Networking core
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4_AUTO=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POLL_MAX=4
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONFIG_SETTINGS=n

# Buffers sized for a 10 Mbit/s shared segment, conservative on 256 kB RAM.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=6
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=6

# Name resolution + discoverability ("<hostname>.local")
CONFIG_DNS_RESOLVER=y
CONFIG_MDNS_RESPONDER=y
CONFIG_MDNS_RESOLVER=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="switchboard"
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME_MAX_LEN=40

# ---------------------------------------------------------------- 10BASE-T1S MAC-PHY
# ETH_LAN865X / MDIO / T1S PHY drivers are enabled automatically from DT.
CONFIG_ETH_LAN865X_IRQ_THREAD_STACK_SIZE=1024

# ---------------------------------------------------------------- MQTT
CONFIG_MQTT_LIB=y
CONFIG_MQTT_KEEPALIVE=60
CONFIG_APP_MQTT=y

# ---------------------------------------------------------------- DFU (MCUboot + SMP over shell UART)
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y
